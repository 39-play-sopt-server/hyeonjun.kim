name: Java CI with Gradle

# 0. workflow 실행 트리거
on:
  push:
    branches: [ "main" ]
  # workflow를 수동으로 실행하는 방식
  workflow_dispatch:
    inputs:
      testVariable:
        description: 'test variable'
        required: true
        default: 'defaultValue'

jobs:
  # 1. 빌드
  build:

    runs-on: ubuntu-latest
    # 읽기 권한 부여
    permissions:
      contents: read

    steps:
      # 1-1. repository checkout
      - uses: actions/checkout@v4

      # 1-2. jdk 환경 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1-3. '*.yml' 파일 세팅
      - name: application.yml 파일 설정
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      # 1-4. gradle 환경 설치
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 1-5. 빌드
      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      # 1-6. 도커 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1-7. 도커 이미지 빌드 및 이미지 게시
      - name: build docker image & push image to docker hub
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/app:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
        

  # 2. 배포
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 2-1. EC2 서버 접속 및 도커 작업 처리
      - name: SSH로 EC2에 접속하여 도커 작업 처리하기
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            
            IMAGE="${{ secrets.DOCKER_USERNAME }}/app:${{ github.sha }}"

            # Docker 이미지 다운로드
            docker pull "$IMAGE"
  
            # 기존 애플리케이션 컨테이너 삭제
            docker rm -f app-container || true
  
            # 새로운 컨테이너 실행
            docker run -d \
            -p 8080:8080 \
            --restart unless-stopped \
            --name app-container \
            "$IMAGE"
  
            # 컨테이너 상태 확인
            docker ps -a
  
            # 사용하지 않는 이미지 정리
            docker image prune -f
