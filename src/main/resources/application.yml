spring:
  application:
    name: assignment
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000

server:
  forward-headers-strategy: framework
